name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  test:
    name: Test
    # GitHub-hosted, since the repo is public: macOS 27 with Xcode 27, which the
    # deployment target needs. The image is a preview until GitHub makes it GA.
    runs-on: xcode-27
    # A backstop for a wedged xcodebuild rather than a budget for a slow build,
    # so a hang does not run to GitHub's 6-hour default. A run with every cache
    # cold took 18 minutes on 2026-09-30, 10 of them building Mint's packages,
    # which mise now downloads prebuilt; a warm run takes about 6. Re-measure it
    # after adding a cold step.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A RUSTUP_HOME of its own, so the cache holds just the toolchain that
      # rust-toolchain.toml pins, not the image's. Set before mise, which installs
      # the toolchain there.
      - name: Point Rust caches
        run: echo "RUSTUP_HOME=$HOME/.rustup-engine" >> "$GITHUB_ENV"

      # Of CARGO_HOME, only the downloaded crates: the registry's index and
      # archives (not `src/`, which cargo unpacks from them) and `git/`, never
      # `.global-cache`, which is cargo's own SQLite bookkeeping. `target/` makes
      # a run without dependency changes rebuild only the engine crate, and the
      # restore key keeps most of it when the lockfile changes.
      - name: Cache Rust toolchain and crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup-engine
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            Engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Engine/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # Lint runs before the build, not after it. `if: '!cancelled()'` on a later
      # step does not survive a *job* timeout, since GitHub cancels the whole job
      # and no later step starts. Linting first costs seconds and always reports;
      # the condition moves onto the test step so a lint failure still lets the
      # tests run and neither signal masks the other.
      - name: Lint
        run: just lint

      - name: Build engine
        if: '!cancelled()'
        run: just engine

      - name: Check engine bindings
        if: '!cancelled()'
        run: |
          if [ -n "$(git status --porcelain -- Sources/Engine)" ]; then
            git diff -- Sources/Engine
            echo "::error::The engine bindings are stale: run \`just engine\` and commit the bindings."
            exit 1
          fi

      - name: Test engine
        if: '!cancelled()'
        run: just engine-test

      - name: Build and test
        if: '!cancelled()'
        # xcodebuild hands the tests a TEST_RUNNER_ variable without its prefix. The image snapshots
        # run only here, since the runner's rendering is their reference, and SnapshotTesting records
        # afresh any that are missing or fail, for the next step to upload.
        env:
          TEST_RUNNER_CI: "true"
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: just test

      # The runner's references, to download and commit once the change they show is intended.
      - name: Upload snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: Tests/**/__Snapshots__
          if-no-files-found: ignore
